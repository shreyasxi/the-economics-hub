name: World Generator

on:
  schedule:
    # Every Saturday 10:00 UTC, after india.yml (08:00) has pushed its database
    # update, so the two jobs don't push at once. Charts land in the current
    # month's folder, so later runs refresh that edition; the central bank
    # strip, scoreboard and calendar stay at most a week old. (The old
    # '0 8 8-14 * 6' also ran daily on the 8th-14th: cron ORs the two day fields.)
    - cron: '0 10 * * 6'
  workflow_dispatch:  # Manual trigger from GitHub Actions UI

jobs:
  generate-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate World charts and snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python generate_macro.py --mode dashboard

      - name: Copy charts and snapshot to assets/
        run: |
          MONTH_FOLDER=$(ls output/macro/ | sort | tail -1)
          if [ -z "$MONTH_FOLDER" ]; then
            echo "ERROR: No macro output folder found after generation."
            exit 1
          fi
          echo "Copying output/macro/$MONTH_FOLDER/ → assets/macro/$MONTH_FOLDER/"
          mkdir -p "assets/macro/$MONTH_FOLDER"
          cp output/macro/"$MONTH_FOLDER"/*.png output/macro/"$MONTH_FOLDER"/world_snapshot.json "assets/macro/$MONTH_FOLDER/"
          echo "Charts in assets/macro/$MONTH_FOLDER/:"
          ls "assets/macro/$MONTH_FOLDER/"

      - name: Keep only the last 4 months in assets/
        run: python .github/scripts/prune_assets.py macro

      - name: Update README showcase charts
        run: |
          mkdir -p assets/readme_showcase
          MONTH_FOLDER=$(ls output/macro/ | sort | tail -1)
          cp "output/macro/$MONTH_FOLDER/16_macro_cape.png" "assets/readme_showcase/macro_cape.png"
          cp "output/macro/$MONTH_FOLDER/11_macro_oecd_cli.png" "assets/readme_showcase/macro_oecd_cli.png"
          echo "README showcase updated from $MONTH_FOLDER"

      - name: Commit and push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/macro/ assets/readme_showcase/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: World charts $(date -u +%Y-%m-%d)"
          git push
