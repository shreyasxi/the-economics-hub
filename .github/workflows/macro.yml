name: Macro Pulse Generator

on:
  schedule:
    # 08:00 UTC, only when day-of-month is 8–14 AND day-of-week is Saturday.
    # The 2nd Saturday of any month always falls between the 8th and 14th.
    # This cron expression fires exactly once per month, on the 2nd Saturday.
    - cron: '0 8 8-14 * 6'
  workflow_dispatch:  # Manual trigger from GitHub Actions UI

jobs:
  generate-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate macro charts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python generate_macro.py

      - name: Copy charts to assets/
        run: |
          MONTH_FOLDER=$(ls output/macro/ | sort | tail -1)
          if [ -z "$MONTH_FOLDER" ]; then
            echo "ERROR: No macro output folder found after generation."
            exit 1
          fi
          echo "Copying output/macro/$MONTH_FOLDER/ → assets/macro/$MONTH_FOLDER/"
          mkdir -p "assets/macro/$MONTH_FOLDER"
          cp output/macro/"$MONTH_FOLDER"/*.png "assets/macro/$MONTH_FOLDER/"
          echo "Charts in assets/macro/$MONTH_FOLDER/:"
          ls "assets/macro/$MONTH_FOLDER/"

      - name: Commit and push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/macro/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: macro charts $(date -u +%Y-%m)"
          git push
