name: RBI Monetary Conditions Daily

on:
  schedule:
    # Daily, including weekends: 15:10 UTC = 20:40 IST.
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: india-dashboard-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: '.'
      MPLBACKEND: Agg
    steps:
      - name: Checkout latest branch after acquiring shared concurrency slot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic collector and chart dependencies
        run: pip install 'pandas>=2.0.0' 'numpy>=1.24.0' 'matplotlib>=3.7.0' 'requests>=2.31.0' 'beautifulsoup4>=4.12.0'

      - name: Verify collector and targeted monetary contracts
        run: |
          python -m unittest discover -s tests -p 'test_rbi_money_market.py'
          python -m unittest discover -s tests -p 'test_india_monetary_redesign.py'
          python -m unittest discover -s tests -p 'test_rbi_monetary_daily.py'

      - name: Refresh and validate recent official observations
        id: refresh
        run: python -m data.fetchers.rbi_money_market --refresh-recent --overlap 10

      - name: Render and publish only two current-edition monetary charts
        id: charts
        if: steps.refresh.outputs.changed == 'true'
        run: python -m charts.india_charts.india_monetary --refresh-current

      - name: Commit changed monetary data and charts only
        if: steps.refresh.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          CURRENT_EDITION: ${{ steps.charts.outputs.edition }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$(python -m data.paths --relative RBI_MONEY_MARKET_CSV)"
          git add -- "assets/india/$CURRENT_EDITION/19_india_money_market_corridor.png" "assets/india/$CURRENT_EDITION/20_india_system_liquidity.png"
          if git diff --cached --quiet; then
            echo 'No monetary data or chart changes to commit.'
            exit 0
          fi
          git commit -m 'Update RBI monetary conditions'
          # Unrelated workflows can still advance the branch. Rebase safely;
          # conflicts fail closed, with no force push or automatic resolution.
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo '::error::Could not publish RBI monetary conditions after 3 attempts'
          exit 1
