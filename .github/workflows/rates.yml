name: Central Bank Rates

# Refreshes the World tab's central bank rates (strip, scoreboard policy-rate
# column, global rate cycle chart) between the Saturday World runs, so a
# decision shows the day it is announced. Each run reads the banks' own
# announcements (FOMC statement, ECB and BoE rate tables, BoJ statement, PBoC
# open market operations notices) and commits only when a rate, a last move or
# a monthly count has changed, so most runs commit nothing.

on:
  schedule:
    # Weekdays, twice (UTC). GitHub often starts scheduled runs 1-3 hours late.
    - cron: '30 6 * * 1-5'    # after Asia: PBoC notice 01:20, BoJ ~03:00-04:30, RBI 04:30
    - cron: '0 21 * * 1-5'    # after the BoE (11:00/12:00), ECB (12:15/13:15) and Fed (18:00/19:00)
  workflow_dispatch:          # Run workflow on the Actions tab, e.g. right after a decision

concurrency:
  group: central-bank-rates   # never two refreshes writing the snapshot at once
  cancel-in-progress: false

permissions:
  contents: write             # commit the refreshed snapshot, chart and PBoC ledger

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh central bank rates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python generate_macro.py --rates-only

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/macro/ data/pboc_reverse_repo.csv
          if git diff --cached --quiet; then
            echo "No rate has changed — nothing to commit."
            exit 0
          fi
          git commit -m "chore: central bank rates $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Other workflows push to main too (RBI Sentinel on weekdays): rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
