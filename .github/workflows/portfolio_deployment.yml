name: Portfolio Deployment Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate the versioned public datasets
        run: python -m portfolio_lab.deployment --validate
      - name: Verify both investor modes and snapshot integrity
        run: python -m pytest tests/test_portfolio*.py -q
      - name: Independently verify real portfolio calculations
        run: |
          python -m portfolio_lab.verify_real
          python -m portfolio_lab.verify_expansion
          python -m portfolio_lab.verify_research
          python -m portfolio_lab.verify_india
