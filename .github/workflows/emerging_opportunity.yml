name: Institutional flows and ownership

on:
  schedule:
    - cron: '30 8 * * 6'
  workflow_dispatch:

concurrency:
  group: repository-publication-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test release handling and ownership retention
        run: |
          python -m unittest discover -s tests -p 'test_emerging_opportunity.py'
          python -m unittest discover -s tests -p 'test_india_display.py'
      - name: Check released FPI fortnights and refresh quarterly ownership
        run: python -m data.fetchers.emerging_opportunity --refresh --latest-flows --sector all
      - name: Audit sources and prepare verified display release
        run: python -m data.processors.emerging_publication
      - name: Publish research data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stores/india/emerging_opportunity/
          git add data/published/india_research/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore: refresh emerging-sector research'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
