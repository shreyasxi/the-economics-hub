name: Weekly Markets Generator

on:
  schedule:
    # 06:00 UTC every Saturday — ~10 hours after US Friday market close
    - cron: '0 6 * * 6'
  workflow_dispatch:  # Manual trigger from GitHub Actions UI

jobs:
  generate-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly charts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python generate_weekly.py --mode dashboard

      # The week's headlines, collected every 4 hours by the Headline Collector
      # workflow. If there is no pool (its first week, or the cache was lost),
      # the next step reads the feeds once instead.
      - name: Restore the week's headline pool
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: output/headline_pool
          key: headline-pool-${{ github.run_id }}
          restore-keys: headline-pool-

      # The week in headlines (RSS). Optional by design: a feed that fails is only
      # a warning inside the script, and if this step fails or times out anyway,
      # the job carries on and the charts publish without the headlines strip.
      - name: Fetch the week in headlines
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONPATH: "."
        run: |
          DATE_FOLDER=$(ls output/weekly/ | sort | tail -1)
          python generate_news.py --out "output/weekly/$DATE_FOLDER"

      # The Analysis page's "Signal or noise" board: the week's move in each of
      # 52 markets against its typical week (config/signals_settings.py). It
      # writes signals.json into the newest edition, or nothing at all if more
      # than a quarter of the series cannot be read; either way the charts
      # publish, and the page says when an edition has no board.
      - name: Rank the week's unusual moves
        continue-on-error: true
        timeout-minutes: 10
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python generate_signals.py

      - name: Copy charts to assets/
        run: |
          DATE_FOLDER=$(ls output/weekly/ | sort | tail -1)
          if [ -z "$DATE_FOLDER" ]; then
            echo "ERROR: No weekly output folder found after generation."
            exit 1
          fi
          echo "Copying output/weekly/$DATE_FOLDER/ → assets/weekly/$DATE_FOLDER/"
          mkdir -p "assets/weekly/$DATE_FOLDER"
          cp output/weekly/"$DATE_FOLDER"/*.png "assets/weekly/$DATE_FOLDER/"
          if [ -f "output/weekly/$DATE_FOLDER/news.json" ]; then
            cp "output/weekly/$DATE_FOLDER/news.json" "assets/weekly/$DATE_FOLDER/"
          else
            echo "No news.json: this edition publishes without the headlines strip."
          fi
          if [ -f "output/weekly/$DATE_FOLDER/signals.json" ]; then
            cp "output/weekly/$DATE_FOLDER/signals.json" "assets/weekly/$DATE_FOLDER/"
          else
            echo "No signals.json: this edition publishes without the Signal or noise board."
          fi
          echo "Files in assets/weekly/$DATE_FOLDER/:"
          ls "assets/weekly/$DATE_FOLDER/"

      - name: Keep only the last 4 weeks in assets/
        run: python .github/scripts/prune_assets.py weekly

      - name: Update README showcase charts
        run: |
          mkdir -p assets/readme_showcase
          DATE_FOLDER=$(ls output/weekly/ | sort | tail -1)
          cp "output/weekly/$DATE_FOLDER/00_summary_table.png" "assets/readme_showcase/weekly_summary_table.png"
          cp "output/weekly/$DATE_FOLDER/23_crude_oil_curve.png" "assets/readme_showcase/weekly_crude_curve.png"
          echo "README showcase updated from $DATE_FOLDER"

      - name: Commit and push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/weekly/ assets/readme_showcase/
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: weekly charts $(date -u +%Y-%m-%d)"
          git push
