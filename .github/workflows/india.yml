name: India Dashboard Generator

on:
  # Weekly auto-run: Saturday 08:00 UTC (after weekly macro pipeline at 06:00)
  schedule:
    - cron: "0 8 * * 6"

  # Manual trigger — use after updating india_manual.csv / cag_monthly_accounts.xlsx,
  # or to force-regenerate charts without a data fetch.
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Set to 'true' to skip data fetch and regenerate charts only"
        required: false
        default: "false"

jobs:
  # ── Job 1: Fetch latest India macro data ──────────────────────────────────
  # continue-on-error: true — a fetch failure (API downtime, WAF block, jugaad-data
  # break) must NEVER prevent chart generation. Charts render from last-known-good
  # DB state. A stale chart with a timestamp is always better than a crashed pipeline.
  fetch-data:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest India data
        if: ${{ github.event.inputs.skip_fetch != 'true' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONPATH: "."
        run: python data/fetchers/india_fetcher.py --append

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/india_macro.db
          git diff --staged --quiet && echo "No DB changes to commit." && exit 0
          git commit -m "auto: india data fetch $(date -u +%Y-%m-%d)"
          git push

  # ── Job 2: Generate charts ────────────────────────────────────────────────
  # if: always() — runs unconditionally, even if fetch-data failed or was skipped.
  # Reads exclusively from data/india_macro.db (SQLite). If the DB has no new data
  # after a fetch failure, charts regenerate from the previous state — no crash.
  generate-charts:
    runs-on: ubuntu-latest
    needs: fetch-data
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Pull latest DB commit (if fetch-data pushed one)
        run: git pull --rebase origin main || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate India charts
        env:
          PYTHONPATH: "."
        run: python generate_india.py --mode dashboard

      - name: Copy charts to assets/
        run: |
          MONTH_FOLDER=$(ls output/india/ | sort | tail -1)
          if [ -z "$MONTH_FOLDER" ]; then
            echo "ERROR: No India output folder found after generation."
            exit 1
          fi
          echo "Copying output/india/$MONTH_FOLDER/ → assets/india/$MONTH_FOLDER/"
          mkdir -p "assets/india/$MONTH_FOLDER"
          cp output/india/"$MONTH_FOLDER"/*.png "assets/india/$MONTH_FOLDER/"
          echo "Charts in assets/india/$MONTH_FOLDER/:"
          ls "assets/india/$MONTH_FOLDER/"

      - name: Commit and push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/india/
          git diff --staged --quiet && echo "No chart changes to commit." && exit 0
          git commit -m "chore: india charts $(date -u +%Y-%m)"
          git push
