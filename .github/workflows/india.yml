name: India Dashboard Generator

on:
  # Weekly auto-run: Saturday 08:00 UTC (after weekly macro pipeline at 06:00)
  schedule:
    # Capture the official cash-market flow snapshot after each trading day;
    # the chart itself is regenerated in the Saturday India dashboard run.
    - cron: "30 13 * * 1-5"
    - cron: "0 8 * * 6"

  # Manual trigger — use after updating manual data / cag_monthly_accounts.xlsx,
  # or to force-regenerate charts without a data fetch.
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Set to 'true' to skip data fetch and regenerate charts only"
        required: false
        default: "false"
      manual_cpi_fallback:
        description: "Explicit emergency CPI fallback: only concept-labelled manual headline/food pairs"
        required: false
        default: "false"

      manual_iip_fallback:
        description: "Explicit emergency IIP fallback: General / 2022-23-base manual values only"
        required: false
        default: "false"

# Serialize asset publication with the standalone daily monetary refresh.
concurrency:
  group: repository-publication-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  # The daily FII/FPI and DII endpoint has no historical backfill. Collect it
  # on each trading day so the Saturday chart can aggregate complete weeks.
  collect-institutional-flows:
    if: github.ref_type == 'branch' && github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh official NSE daily institutional flows
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_institutional_flows

      - name: Commit daily institutional flow observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/stores/india/nse_institutional_flows/
          git diff --staged --quiet && echo "No new institutional flow observation." && exit 0
          git commit -m "data: refresh daily NSE FPI and DII flows"
          git push origin "${{ github.ref_name }}"

  # All source updates and generation share one checkout. Optional source
  # failures are gated per chart; independent charts still render.
  generate-charts:
    if: github.ref_type == 'branch' && (github.event_name != 'schedule' || github.event.schedule == '0 8 * * 6')
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify official MoSPI GVA contracts
        id: gva-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_mospi_gva.py'

      - name: Verify official MoSPI General IIP contracts
        id: iip-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_mospi_iip.py'

      - name: Verify India trade contracts
        id: trade-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_india_trade.py'

      - name: Verify RBI external source contracts
        id: rbi-external-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s tests -p 'test_rbi_external.py'
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_failed_reer_renders_validated_store_and_does_not_block_vulnerability
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_failed_vulnerability_renders_validated_store_and_does_not_block_reer
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_failed_external_refresh_with_invalid_store_omits_only_affected_chart
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_invalid_external_store_cannot_abort_independent_charts

      - name: Fetch latest India data including official GVA
        id: india-fetch
        if: ${{ github.event.inputs.skip_fetch != 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
          INDIA_FETCH_SKIP_GVA: ${{ steps.gva-contracts.outcome == 'failure' }}
          INDIA_FETCH_SKIP_TRADE_SUPPLEMENT: ${{ steps.trade-contracts.outcome == 'failure' }}
          INDIA_FETCH_SKIP_WSS: ${{ steps.rbi-external-contracts.outcome == 'failure' }}
        run: python data/fetchers/india_fetcher.py --append

      - name: Verify official IIP industry and monthly PLFS contracts
        id: india-activity-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_mospi_activity*.py'

      - name: Refresh official MoSPI IIP manufacturing industries
        id: mospi-iip-industries
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.india-activity-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_iip_industries

      - name: Refresh official MoSPI monthly urban youth unemployment
        id: mospi-plfs
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.india-activity-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_plfs_monthly

      - name: Refresh official MoSPI General IIP current-base history
        id: mospi-iip
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.iip-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_iip

      - name: Verify RBI State of the Economy parser contracts
        id: soe-contracts
        continue-on-error: true
        run: |
          python tests/test_soe.py
          python tests/test_soe_pdf.py
          python tests/test_soe_independence.py

      - name: Verify RBI survey chart contracts
        id: rbi-survey-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s tests -p 'test_rbi_categories.py'
          python -m unittest discover -s tests -p 'test_rbi_consumer.py'
          python -m unittest discover -s tests -p 'test_rbi_consumer_drivers.py'
          python -m unittest discover -s tests -p 'test_rbi_discretionary.py'
          python -m unittest discover -s tests -p 'test_rbi_inflation_expectations.py'
          python -m unittest discover -s tests -p 'test_rbi_replacement.py'

      # RBI's State of the Economy, part 1 of 2: the transmission history the
      # pass-through chart is drawn from. continue-on-error — rbi.org.in being
      # slow or reshaping its table must not stop the charts; the chart is then
      # drawn from the last committed history, or skipped if there is none.
      - name: Read RBI transmission table (State of the Economy)
        if: ${{ steps.soe-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python generate_soe.py --history

      - name: Verify NSE risk-appetite contracts
        id: nse-indices-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_nse_indices.py'

      - name: Verify NSE gross TRI contracts
        id: nse-tri-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_nse_tri.py'

      - name: Verify NSE sector rotation contracts
        id: nse-rotation-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_nse_sector_rotation.py'

      - name: Verify NSE sector valuation contracts
        id: nse-valuation-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_nse_valuations.py'

      - name: Verify India equity matrix contracts
        id: india-equity-matrix-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_india_equity_matrix.py'

      - name: Refresh official NSE risk-appetite indices
        id: nse-risk
        if: ${{ steps.nse-indices-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_risk_appetite

      - name: Refresh official NSE daily India VIX and NIFTY 50 history
        id: nse-options-risk
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_options_risk_premium

      - name: Refresh official NSE NIFTY 50 option skew history
        id: nse-downside-skew
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_nifty_downside_skew

      - name: Refresh latest NSE institutional flow observation
        id: nse-institutional-flows
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_institutional_flows

      - name: Refresh official NSE gross TRI equity matrix
        id: nse-equity
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.nse-tri-contracts.outcome == 'success' && steps.india-equity-matrix-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.india_equity_tri

      - name: Refresh official NSE sector rotation snapshot
        id: nse-rotation
        if: ${{ steps.nse-rotation-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_sector_rotation

      # Optional chart: fail this update on bad source data, then omit valuations.
      - name: Refresh official NSE sector valuations
        id: nse-valuations
        if: ${{ steps.nse-valuation-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nse_valuations.collector --update

      - name: Verify official CPI contribution contracts
        id: cpi-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_cpi_contributions.py'

      - name: Verify India dashboard wiring
        id: india-wiring-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_india_saturday.py'

      - name: Refresh official MoSPI CPI 2024 contributions
        id: mospi-cpi
        if: ${{ steps.cpi-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_cpi --update

      - name: Map official CPI General and Food rates to main chart
        id: cpi-main
        if: ${{ steps.mospi-cpi.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_inflation

      - name: Verify official CPI item contracts
        id: cpi-item-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s tests -p 'test_cpi_items.py'
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_cpi_timeout_clears_both_panels_and_audit_without_reading_old_store

      - name: Verify India display contracts
        id: india-display-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_india_display.py'

      - name: Verify shared India artifact publication contract
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: |
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_publication_replaces_panels_and_audit_then_removes_omitted_artifacts
          python -m unittest tests.test_india_source_workflow.SaturdaySources.test_incomplete_cpi_panels_are_not_published

      - name: Verify source-scoped India workflow wiring
        id: india-source-wiring-contracts
        continue-on-error: true
        env:
          PYTHONPATH: "."
          MPLBACKEND: Agg
        run: python -m unittest tests.test_india_source_workflow.SaturdaySources.test_collectors_precede_generation_and_skipped_fetches_do_not_close_gates

      - name: Refresh official MoSPI CPI items
        id: mospi-cpi-items
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.cpi-item-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.mospi_cpi_items --update

      - name: Refresh official RBI REER
        id: rbi-reer
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.rbi-external-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.rbi_external --series reer

      - name: Refresh official RBI DEA external vulnerability
        id: rbi-vulnerability
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.rbi-external-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.rbi_external --series vulnerability

      - name: Warn about external vulnerability refresh failure
        if: ${{ steps.rbi-vulnerability.outcome == 'failure' }}
        run: echo "::warning title=External vulnerability refresh failed::Publishing validated stored observations with their original dates when available. See the failed refresh step for details."

      - name: Test official NSDL FPI contracts
        id: nsdl-fpi-contracts
        continue-on-error: true
        env:
          MPLBACKEND: Agg
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p 'test_nsdl_fpi.py'

      - name: Refresh official NSDL monthly and MTD FPI flows
        id: nsdl-fpi
        if: ${{ github.event.inputs.skip_fetch != 'true' && steps.nsdl-fpi-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONPATH: "."
        run: python -m data.fetchers.nsdl_fpi

      - name: Report NSDL FPI source failure
        if: ${{ steps.nsdl-fpi.outcome == 'failure' }}
        run: echo "::warning title=NSDL FPI refresh failed::Keeping validated FPI observations with their original dates. See the failed refresh step for details."

      - name: Report isolated India contract failures
        if: always()
        env:
          GVA_TEST: ${{ steps.gva-contracts.outcome }}
          IIP_TEST: ${{ steps.iip-contracts.outcome }}
          TRADE_TEST: ${{ steps.trade-contracts.outcome }}
          ACTIVITY_TEST: ${{ steps.india-activity-contracts.outcome }}
          SOE_TEST: ${{ steps.soe-contracts.outcome }}
          SURVEY_TEST: ${{ steps.rbi-survey-contracts.outcome }}
          NSE_INDEX_TEST: ${{ steps.nse-indices-contracts.outcome }}
          NSE_TRI_TEST: ${{ steps.nse-tri-contracts.outcome }}
          NSE_ROTATION_TEST: ${{ steps.nse-rotation-contracts.outcome }}
          NSE_VALUATION_TEST: ${{ steps.nse-valuation-contracts.outcome }}
          EQUITY_MATRIX_TEST: ${{ steps.india-equity-matrix-contracts.outcome }}
          CPI_TEST: ${{ steps.cpi-contracts.outcome }}
          CPI_ITEM_TEST: ${{ steps.cpi-item-contracts.outcome }}
          EXTERNAL_TEST: ${{ steps.rbi-external-contracts.outcome }}
          NSDL_TEST: ${{ steps.nsdl-fpi-contracts.outcome }}
          DISPLAY_TEST: ${{ steps.india-display-contracts.outcome }}
          WIRING_TEST: ${{ steps.india-wiring-contracts.outcome }}
          SOURCE_WIRING_TEST: ${{ steps.india-source-wiring-contracts.outcome }}
        run: |
          for result in \
            "MoSPI GVA:$GVA_TEST" "MoSPI General IIP:$IIP_TEST" "India trade:$TRADE_TEST" \
            "MoSPI activity:$ACTIVITY_TEST" "RBI State of the Economy:$SOE_TEST" \
            "RBI surveys:$SURVEY_TEST" "NSE indices:$NSE_INDEX_TEST" "NSE TRI:$NSE_TRI_TEST" \
            "NSE rotation:$NSE_ROTATION_TEST" "NSE valuations:$NSE_VALUATION_TEST" \
            "India equity matrix:$EQUITY_MATRIX_TEST" "CPI:$CPI_TEST" "CPI items:$CPI_ITEM_TEST" \
            "RBI external:$EXTERNAL_TEST" "NSDL FPI:$NSDL_TEST" \
            "India display:$DISPLAY_TEST" "India wiring:$WIRING_TEST" \
            "India source wiring:$SOURCE_WIRING_TEST"; do
            if [[ "${result#*:}" == "failure" ]]; then
              echo "::warning title=India ${result%%:*} checks failed::See the matching contract step. Its source/chart group is omitted while independent groups continue."
            fi
          done

      - name: Generate India charts
        # CPI is optional, but failed refreshes must omit its chart.
        env:
          PYTHONPATH: "."
          GVA_UPDATE_FAILED: ${{ (steps.india-fetch.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.gva-contracts.outcome == 'failure' }}
          IIP_UPDATE_FAILED: ${{ (steps.mospi-iip.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.iip-contracts.outcome == 'failure' }}
          IIP_MANUAL_FALLBACK: ${{ github.event.inputs.manual_iip_fallback == 'true' }}
          IIP_INDUSTRIES_UPDATE_FAILED: ${{ (steps.mospi-iip-industries.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.india-activity-contracts.outcome == 'failure' }}
          PLFS_UPDATE_FAILED: ${{ (steps.mospi-plfs.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.india-activity-contracts.outcome == 'failure' }}
          NSE_RISK_UPDATE_FAILED: ${{ steps.nse-risk.outcome != 'success' }}
          NSE_OPTIONS_RISK_UPDATE_FAILED: ${{ steps.nse-options-risk.outcome != 'success' }}
          NSE_DOWNSIDE_SKEW_UPDATE_FAILED: ${{ steps.nse-downside-skew.outcome != 'success' }}
          NSE_INSTITUTIONAL_FLOWS_UPDATE_FAILED: ${{ steps.nse-institutional-flows.outcome != 'success' }}
          NSE_ROTATION_UPDATE_FAILED: ${{ steps.nse-rotation.outcome != 'success' }}
          NSE_EQUITY_UPDATE_FAILED: ${{ (steps.nse-equity.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.nse-tri-contracts.outcome == 'failure' || steps.india-equity-matrix-contracts.outcome == 'failure' }}
          CPI_MAIN_UPDATE_FAILED: ${{ steps.cpi-main.outcome != 'success' }}
          CPI_MANUAL_FALLBACK: ${{ github.event.inputs.manual_cpi_fallback == 'true' }}
          NSE_VALUATIONS_UPDATE_FAILED: ${{ steps.nse-valuations.outcome != 'success' }}
          CPI_UPDATE_FAILED: ${{ steps.mospi-cpi.outcome != 'success' || steps.cpi-contracts.outcome == 'failure' }}
          CPI_ITEMS_UPDATE_FAILED: ${{ (steps.mospi-cpi-items.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.cpi-item-contracts.outcome == 'failure' }}
          REER_UPDATE_FAILED: ${{ (steps.rbi-reer.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.rbi-external-contracts.outcome == 'failure' }}
          EXTERNAL_VULNERABILITY_UPDATE_FAILED: ${{ (steps.rbi-vulnerability.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.rbi-external-contracts.outcome == 'failure' }}
          RBI_EXTERNAL_TESTS_FAILED: ${{ steps.rbi-external-contracts.outcome == 'failure' }}
          TRADE_CONTRACTS_FAILED: ${{ steps.trade-contracts.outcome == 'failure' }}
          RBI_SOE_TESTS_FAILED: ${{ steps.soe-contracts.outcome == 'failure' }}
          RBI_SURVEYS_TESTS_FAILED: ${{ steps.rbi-survey-contracts.outcome == 'failure' }}
          NSDL_FPI_UPDATE_FAILED: ${{ (steps.nsdl-fpi.outcome != 'success' && github.event.inputs.skip_fetch != 'true') || steps.nsdl-fpi-contracts.outcome == 'failure' }}
        run: python generate_india.py --mode dashboard

      # Part 2 of 2: the briefing shown at the top of the tab, written into the
      # edition folder the charts just went to, so text and charts always match
      # and are pruned together. The article page is already in this job's cache
      # from the step above. Prose is processed independently of transmission tables.
      - name: Read RBI briefing (State of the Economy)
        if: ${{ steps.soe-contracts.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONPATH: "."
        run: |
          MONTH_FOLDER=$(ls output/india/ | sort | tail -1)
          python generate_soe.py --briefing-only --out "output/india/$MONTH_FOLDER"

      - name: Clear RBI briefing after failed parser checks
        if: ${{ steps.soe-contracts.outcome == 'failure' }}
        run: |
          MONTH_FOLDER=$(ls output/india/ | sort | tail -1)
          rm -f "output/india/$MONTH_FOLDER/soe.json"

      - name: Copy charts to assets/
        run: |
          MONTH_FOLDER=$(ls output/india/ | sort | tail -1)
          if [ -z "$MONTH_FOLDER" ]; then
            echo "ERROR: No India output folder found after generation."
            exit 1
          fi
          echo "Copying output/india/$MONTH_FOLDER/ → assets/india/$MONTH_FOLDER/"
          mkdir -p "assets/india/$MONTH_FOLDER"
          # Remove omitted optional artifacts before copying this run's output.
          for NAME in 03_india_fpi_monthly 08_india_interest_revenue 16_india_forex_reserves 17_india_trade 18_india_rate_transmission 22_india_gva_contributions 21_india_risk_appetite 06_india_inflation_bar 15_india_iip; do
            if [ ! -f "output/india/$MONTH_FOLDER/$NAME.png" ]; then
              rm -f "assets/india/$MONTH_FOLDER/$NAME.png"
            fi
          done
          # Remove the optional valuation artifact when this run omitted it.
          if [ ! -f "output/india/$MONTH_FOLDER/22_india_sector_valuations.png" ]; then
            rm -f "assets/india/$MONTH_FOLDER/22_india_sector_valuations.png"
          fi
          # A failed official rotation snapshot must not leave a prior chart published.
          rm -f "assets/india/$MONTH_FOLDER/23_india_sector_rotation_12m_benchmark.png" "assets/india/$MONTH_FOLDER/23_india_sector_rotation_12m_benchmark.json"
          # Never carry a previous CPI chart into an edition after a failed update.
          rm -f "assets/india/$MONTH_FOLDER/24_india_cpi_contributions.png" "assets/india/$MONTH_FOLDER/24_india_cpi_contributions.json"
          cp output/india/"$MONTH_FOLDER"/*.png "assets/india/$MONTH_FOLDER/"
          # A sidecar-backed chart is published only as a complete pair.
          for NAME in 23_india_sector_rotation_12m_benchmark 24_india_cpi_contributions; do
            if [ -f "output/india/$MONTH_FOLDER/$NAME.png" ] && [ -f "output/india/$MONTH_FOLDER/$NAME.json" ]; then
              cp "output/india/$MONTH_FOLDER/$NAME.png" "output/india/$MONTH_FOLDER/$NAME.json" "assets/india/$MONTH_FOLDER/"
            else
              rm -f "assets/india/$MONTH_FOLDER/$NAME.png" "assets/india/$MONTH_FOLDER/$NAME.json"
              echo "::warning title=India chart omitted::$NAME did not produce both its image and audit file."
            fi
          done
          # Fiscal deficit remains in the snapshot; its standalone chart is retired.
          rm -f "assets/india/$MONTH_FOLDER/11_india_fiscal_deficit_gdp.png"
          # Clear omitted external charts; publish CPI item panels with their audit.
          for NAME in 30_india_reer 31_india_external_vulnerability; do
            if [ ! -f "output/india/$MONTH_FOLDER/$NAME.png" ]; then
              rm -f "assets/india/$MONTH_FOLDER/$NAME.png"
            fi
          done
          rm -f "assets/india/$MONTH_FOLDER/06b_india_cpi_items.json" "assets/india/$MONTH_FOLDER/06b_india_cpi_items.display.json" "assets/india/$MONTH_FOLDER/06b_india_cpi_items_increases.png" "assets/india/$MONTH_FOLDER/06b_india_cpi_items_declines.png"
          if [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items.json" ] && [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items.display.json" ] && [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items_increases.png" ] && [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items_declines.png" ]; then
            cp "output/india/$MONTH_FOLDER/06b_india_cpi_items.json" "output/india/$MONTH_FOLDER/06b_india_cpi_items.display.json" "output/india/$MONTH_FOLDER/06b_india_cpi_items_increases.png" "output/india/$MONTH_FOLDER/06b_india_cpi_items_declines.png" "assets/india/$MONTH_FOLDER/"
          elif [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items.json" ] || [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items.display.json" ] || [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items_increases.png" ] || [ -f "output/india/$MONTH_FOLDER/06b_india_cpi_items_declines.png" ]; then
            echo "::warning title=India CPI item panels omitted::The data, display audit and both images must be present together."
          fi
          # Publish the heatmap and leader metrics together; clear an omitted edition.
          rm -f "assets/india/$MONTH_FOLDER/india_equity_matrix.json"
          if [ -f "output/india/$MONTH_FOLDER/india_equity_matrix.json" ]; then
            cp "output/india/$MONTH_FOLDER/india_equity_matrix.json" "assets/india/$MONTH_FOLDER/"
          fi
          rm -f "assets/india/$MONTH_FOLDER/india_iip_industry_heatmap.json"
          if [ -f "output/india/$MONTH_FOLDER/india_iip_industry_heatmap.json" ]; then
            cp "output/india/$MONTH_FOLDER/india_iip_industry_heatmap.json" "assets/india/$MONTH_FOLDER/"
          fi
          # Youth unemployment now lives in the regenerated economic snapshot.
          rm -f "assets/india/$MONTH_FOLDER/15b_india_urban_youth_unemployment.png"
          # Publish survey PNGs with their audits; remove omitted/retired artifacts.
          for NAME in 25_india_inflation_expectations 26_india_household_price_categories 27_india_consumer_confidence_urban_rural 27b_india_discretionary_spending_sentiment 28_india_consumer_confidence_urban_components 29_india_consumer_confidence_rural_components 28_india_consumer_confidence_drivers; do
            rm -f "assets/india/$MONTH_FOLDER/$NAME.png" "assets/india/$MONTH_FOLDER/$NAME.json"
            if [ -f "output/india/$MONTH_FOLDER/$NAME.png" ] && [ -f "output/india/$MONTH_FOLDER/$NAME.json" ]; then
              cp "output/india/$MONTH_FOLDER/$NAME."{png,json} "assets/india/$MONTH_FOLDER/"
            elif [ -f "output/india/$MONTH_FOLDER/$NAME.png" ] || [ -f "output/india/$MONTH_FOLDER/$NAME.json" ]; then
              echo "::warning title=India survey chart omitted::$NAME did not produce both its image and audit file."
            fi
          done
          rm -f "assets/india/$MONTH_FOLDER/soe.json"
          if [ -f "output/india/$MONTH_FOLDER/soe.json" ]; then
            cp "output/india/$MONTH_FOLDER/soe.json" "assets/india/$MONTH_FOLDER/"
          else
            echo "No soe.json: this edition publishes without the State of the Economy briefing."
          fi
          echo "Charts in assets/india/$MONTH_FOLDER/:"
          ls "assets/india/$MONTH_FOLDER/"

      - name: Keep only the last 4 months in assets/
        run: python .github/scripts/prune_assets.py india

      - name: Refresh India overview cards
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: python generate_macro_cards.py --publish --only india

      - name: Update README showcase charts
        run: |
          mkdir -p assets/readme_showcase
          MONTH_FOLDER=$(ls output/india/ | sort | tail -1)
          if [ -f "output/india/$MONTH_FOLDER/08_india_interest_revenue.png" ]; then
            cp "output/india/$MONTH_FOLDER/08_india_interest_revenue.png" "assets/readme_showcase/india_interest_revenue.png"
          else
            rm -f "assets/readme_showcase/india_interest_revenue.png"
          fi
          cp "output/india/$MONTH_FOLDER/07_india_expenditure_quality.png" "assets/readme_showcase/india_expenditure_quality.png"
          echo "README showcase updated from $MONTH_FOLDER"

      - name: Commit and push charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/india/ assets/readme_showcase/ assets/macro_cards.json "$(python -m data.paths --relative RBI_TRANSMISSION_CSV)" data/stores/india/rbi_transmission.json "$(python -m data.paths --relative NSE_INDICES_DIR)" "$(python -m data.paths --relative NSE_OPTIONS_RISK_PREMIUM_DIR)" "$(python -m data.paths --relative NSE_INSTITUTIONAL_FLOWS_DIR)" "$(python -m data.paths --relative NSE_NIFTY_DOWNSIDE_SKEW_DIR)" "$(python -m data.paths --relative NSE_VALUATIONS_DIR)" "$(python -m data.paths --relative INDIA_DB)"
          # Include canonical monthly histories and the raw evidence their loaders verify.
          SOURCE_PATHS=$(python -m data.paths --relative MOSPI_IIP_CSV MOSPI_PLFS_CSV MOSPI_SOURCES_DIR RBI_WSS_CSV RBI_REER_CSV INDIA_EXTERNAL_CSV)
          while IFS= read -r SOURCE_PATH; do
            if [ -e "$SOURCE_PATH" ]; then
              git add -A "$SOURCE_PATH"
            fi
          done <<< "$SOURCE_PATHS"
          EQUITY_TRI=$(python -m data.paths --relative INDIA_EQUITY_TRI)
          if [ -f "$EQUITY_TRI" ]; then
            git add "$EQUITY_TRI"
          fi
          # A skipped optional source may never create its directory.
          SOURCE_DIRS=$(python -m data.paths --relative CPI_CONTRIBUTIONS_DIR CPI_MAIN_DIR CPI_ITEMS_DIR NSE_ROTATION_DIR GVA_DIR IIP_DIR NSDL_FPI_DIR)
          while IFS= read -r SOURCE_DIR; do
            if [ -d "$SOURCE_DIR" ]; then
              git add -A "$SOURCE_DIR"
            fi
          done <<< "$SOURCE_DIRS"
          git diff --staged --quiet && echo "No chart changes to commit." && exit 0
          git commit -m "chore: india charts $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" && exit 0
            sleep 10
          done
          exit 1
