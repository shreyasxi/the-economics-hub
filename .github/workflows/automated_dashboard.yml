name: Global Macro & Weekly Engine

on:
  schedule:
    # Runs every Friday at 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch: 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Execute and Organize Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} 
          PYTHONPATH: "."
        run: |
          mkdir -p hosted_charts
          rm -f hosted_charts/*.png
          
          echo "Starting Generators..."
          python generate_macro.py 
          python generate_weekly.py 
          
          echo "=== DIAGNOSTIC: WHAT DID PYTHON ACTUALLY MAKE? ==="
          ls -R output/ || echo "WARNING: Output folder does not exist!"
          
          echo "=== COPYING CHARTS ==="
          # Because we know your script uses output/weekly/DATE/, we target output/ directly
          find output/ -type f -name "*.png" -exec cp {} hosted_charts/ \; || true
          
          echo "=== DIAGNOSTIC: WHAT IS IN THE STOREFRONT? ==="
          ls -l hosted_charts/