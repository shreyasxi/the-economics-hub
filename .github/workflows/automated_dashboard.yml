name: Global Macro & Weekly Engine

on:
  schedule:
    # Runs every Friday at 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch: 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Execute Data Pipelines
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} 
        run: |
          echo "Starting Macro Generation..."
          python generate_macro.py 
          echo "Starting Weekly Generation..."
          python generate_weekly.py 

      - name: Commit and Push Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Economics Hub Bot"
          git add assets/
          git commit -m "Automated data refresh: Macro & Weekly charts [skip ci]" || echo "No changes to commit"
          git push
