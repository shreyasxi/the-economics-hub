name: Global Macro & Weekly Engine

on:
  schedule:
    # Runs every Friday at 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch: 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Execute and Organize Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} 
          PYTHONPATH: "."
        run: |
          # 1. Create the storefront folder and wipe last week's display
          mkdir -p hosted_charts
          rm -f hosted_charts/*.png
          
          # 2. Run your generators (wherever they decide to save the files locally)
          echo "Starting Macro Generation..."
          python generate_macro.py 
          echo "Starting Weekly Generation..."
          python generate_weekly.py 
          
          # 3. THE CATCH-ALL: Search every single folder in the repository for PNGs 
          # and copy them directly into the Streamlit storefront.
          find . -type f -name "*.png" -not -path "*/hosted_charts/*" -exec cp {} hosted_charts/ \;

      - name: Commit and Push Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Economics Hub Bot"
          
          # 4. Track the storefront and push
          git add hosted_charts/
          git commit -m "Automated data refresh: Storefront Catch-All [skip ci]" || echo "No changes to commit"
          git push