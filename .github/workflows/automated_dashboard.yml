name: Global Macro & Weekly Engine

on:
  schedule:
    # Runs every Friday at 18:00 UTC
    - cron: '0 18 * * 5'
  workflow_dispatch: 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Execute and Organize Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }} 
          PYTHONPATH: "."
        run: |
          # 1. Create the hosting folder and wipe last week's data
          mkdir -p hosted_charts
          rm -f hosted_charts/*.png
          
          # 2. Run your generators (which secretly dump files into output/)
          echo "Starting Macro Generation..."
          python generate_macro.py 
          echo "Starting Weekly Generation..."
          python generate_weekly.py 
          
          # 3. THE FIX: Dig into the output/ folder, find every PNG, and move it to hosted_charts/
          find output -type f -name "*.png" -exec mv {} hosted_charts/ \;