[theme]
# Institutional light theme — mirrors EconStyle color system
base                     = "light"
primaryColor             = "#003366"      # EconStyle navy
backgroundColor          = "#F4F5F7"      # Subtle off-white — eliminates "sea of white"
secondaryBackgroundColor = "#ECEEF1"      # Sidebar / input backgrounds
textColor                = "#0A0A0A"      # Near-black for maximum legibility
font                     = "serif"        # Closest to Cambria; refined further via CSS

[server]
headless    = true    # Required for Streamlit Cloud
enableCORS  = false
port        = 8501

[browser]
gatherUsageStats = false
