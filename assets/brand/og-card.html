  1200 × 630 in any headless Chromium once its web fonts have loaded, e.g.
    chromium --headless --hide-scrollbars --window-size=1200,630 \

  and keep the PNG under 300 KB, above which WhatsApp tends to drop it.
-->

<style>
  :root { --navy: #0A1F3D; --ivory: #FFFFF0; --amber: #E9A15B; }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--navy); }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--ivory);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(760px 420px at 50% 16%, rgba(38, 84, 146, 0.55) 0%, rgba(38, 84, 146, 0) 72%),
      linear-gradient(180deg, #0D2649 0%, #0A1F3D 52%, #071831 100%);
  }
  /* A hairline frame, set in from the edge like a printed cover. */
  .card::before {
    content: ""; position: absolute; inset: 24px; border: 1px solid rgba(255, 255, 240, 0.13);
    border-radius: 3px; pointer-events: none; z-index: 2;
  }
  .chart { position: absolute; left: 0; bottom: 0; width: 1200px; height: 250px; z-index: 0; }
  .content {
    position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding-top: 70px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .mark { width: 74px; height: 74px; display: block; }
  .wordmark { margin-top: 20px; display: flex; align-items: baseline; gap: 16px; line-height: 1; }
  .the { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 64px; }
  .name {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 47px;
    letter-spacing: 0.2em; text-transform: uppercase; margin-right: -0.2em;
  }
  .descriptor {
    margin-top: 32px; padding: 12px 30px 13px 36px;
    border-top: 1px solid rgba(255, 255, 240, 0.3); border-bottom: 1px solid rgba(255, 255, 240, 0.3);
    font-weight: 700; font-size: 17px; letter-spacing: 0.26em; text-transform: uppercase;
    color: rgba(255, 255, 240, 0.92);
  }
  .sections {
    margin-top: 28px; display: flex; align-items: center; gap: 20px;
    font-weight: 600; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255, 255, 240, 0.64);
  }
  .sections i { width: 4px; height: 4px; border-radius: 50%; background: var(--amber); opacity: 0.9; }
</style>
</head>
